name: Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: python3 generate_skyblock_mod.py
      - run: cd skyblockcore && gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: skyblockcore-jar
          path: skyblockcore/build/libs/*.jar

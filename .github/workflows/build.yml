name: Build SkyBlock Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 3. Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 4. Verify tools
        run: |
          echo "Python: $(python3 --version)"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "Gradle: $(gradle --version | grep Gradle)"

      - name: 5. Generate project files with Python
        run: python3 generate_skyblock_mod.py

      - name: 6. Show generated files
        run: |
          echo "=== Generated project structure ==="
          find skyblockcore -type f | sort

      - name: 7. Build mod with Gradle
        working-directory: skyblockcore
        run: gradle build --no-daemon --stacktrace

      - name: 8. List built JARs
        run: ls -la skyblockcore/build/libs/ || echo "No JARs found!"

      - name: 9. Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyblockcore-jar
          path: skyblockcore/build/libs/*.jar
          if-no-files-found: error

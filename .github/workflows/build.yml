name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate project files
        run: python generate_skyblock_mod.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        working-directory: skyblockcore
        run: gradle build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: skyblockmod
          path: skyblockcore/build/libs/*.jar
